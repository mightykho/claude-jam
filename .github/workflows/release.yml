name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Activate pinned toolchain and add target
        # `rust-toolchain.toml` pins the channel; `rustup show` triggers the
        # auto-install on first use. `target add` then installs the std for
        # the cross-compile target against the pinned toolchain (not stable).
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/cj" "dist/cj"
          cd dist
          tar czf "cj-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" cj
          shasum -a 256 "cj-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            > "cj-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256"
          rm cj

      - uses: actions/upload-artifact@v4
        with:
          name: cj-${{ matrix.target }}
          path: dist/*

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
