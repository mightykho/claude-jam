[package]
name = "claude-jam"
version = "0.1.2"
edition = "2021"
description = "A fancy tmux window switcher and TUI dashboard for modern agentic workflows"
license = "MIT"
readme = "README.md"
keywords = ["claude", "claude-code", "tui", "tmux", "dashboard"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cj"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
